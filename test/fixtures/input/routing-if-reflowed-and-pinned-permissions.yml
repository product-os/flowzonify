name: Flowzone

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  # allow external contributions to use secrets within trusted code
  pull_request_target:
    types: [opened, synchronize, closed]
    branches: [main, master]

# Base permissions required by Flowzone
permissions:
    actions: none
    attestations: none
    checks: none
    contents: read
    deployments: none
    id-token: none
    issues: none
    discussions: none
    pages: none
    pull-requests: none
    repository-projects: none
    security-events: none
    statuses: none

    # Additional permissions needed by this repo, such as:
    packages: write # Allow Flowzone to publish to ghcr.io

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master
    # prevent duplicate workflows and only allow one `pull_request` or `pull_request_target` for
    # internal or external contributions respectively
    if: |
      (github.event.pull_request.head.repo.full_name == github.repository && github.event_name == 'pull_request') ||
      (github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request_target')
    secrets: inherit
    with:
      restrict_custom_actions: false
      custom_test_matrix: >
        {
          "environment": ["test"]
        }
      docker_images:
        ghcr.io/example-org/example-service
      docker_runs_on: >
        {
          "linux/amd64": ["self-hosted","X64"],
          "linux/arm64": ["self-hosted","ARM64"]
        }
